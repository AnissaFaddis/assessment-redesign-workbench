</footer>

<script>
/* =====================================================================
   STATE — memory only. No localStorage / sessionStorage / cookies.
   ===================================================================== */
const state = {
  screen:'landing', group:0,
  context:{ subject:'', grade:'', course:'', assignment:'', position:'', time:'', goal:'' },
  answers:{},
  selected:[],          // move ids
  specifics:{},          // moveId -> designer's authored text
  draft:{ task:'', submission:'', media:'', criteria:'', ai:'', sequence:'' },
  notes:'',
  rawDraft:null,         // set if designer edits the assembled text directly
  stress:{ output:'', verdict:'', satisfied:'', resisted:'' },
  rubric:null,           // { criteria:[...] } once Mode B is entered
  unit:{ subject:'', grade:'', duration:'', goals:'', items:[] },
  nextAfterContext:'diagnostic',
  touched:false
};
window.addEventListener('beforeunload', e => { if (state.touched) { e.preventDefault(); e.returnValue=''; } });

/* =====================================================================
   FRAMEWORK
   ===================================================================== */
const DIMS = {
  P1:{tier:1,name:'Cognitive demand',why:'Generative models perform worst at the top of Bloom\u2019s range \u2014 analyze, evaluate, create \u2014 and worst of all when the task needs judgment about one particular situation rather than a general one.',
      read:{WELL:'The task needs judgment a model can\u2019t supply from general knowledge.',PART:'The thinking is real, but a well-informed outsider could still land it.',OPEN:'The task can be satisfied with recall, summary, or a known procedure.'}},
  P2:{tier:1,name:'Process visibility',why:'AI text arrives fully formed with no history. Staged checkpoints, revision logs, and decision logs make the intellectual journey the assessed object \u2014 and a journey is much harder to fabricate than an endpoint.',
      read:{WELL:'The work is assessed as it develops, not only at the end.',PART:'Some process exists, but it isn\u2019t carrying assessment weight.',OPEN:'One submission at the end, with no record of how it got there.'}},
  P3:{tier:1,name:'Modality and presence',why:'A recorded, unscripted explanation of one\u2019s own reasoning is a human-presence layer. Live work is off the table here; asynchronous video and audio satisfy this principle completely.',
      read:{WELL:'The student\u2019s own voice or face is a required part of the evidence.',PART:'There\u2019s some range in format, but presence is optional.',OPEN:'Text only \u2014 exactly the medium a model produces natively.'}},
  P4:{tier:1,name:'Metacognition',why:'Honest self-account \u2014 what was hard, where the AI\u2019s suggestion fell short, how the understanding shifted \u2014 is difficult to outsource, and it reinforces the learning while it documents it.',
      read:{WELL:'Reflection is required and graded, including the student\u2019s AI use.',PART:'Reflection is invited but not weighted.',OPEN:'No account of the student\u2019s own thinking is required.'}},
  P5:{tier:1,name:'Interconnection',why:'Isolated assignments can\u2019t be AI-proofed one at a time. Validity comes from coherence \u2014 later tasks consuming earlier student-produced evidence, so the chain has to hold together across a term.',
      read:{WELL:'This task is structurally linked to work before or after it.',PART:'There are loose connections to other work.',OPEN:'This task stands alone, which makes it individually delegable.'}},
  P6:{tier:2,name:'Local grounding',why:'A geographically scattered student body is an asset here: one prompt, and every student\u2019s own street, kitchen, or workplace yields data no model can fabricate.',
      read:{WELL:'Firsthand local evidence is core to the task.',PART:'Local material is welcome but optional.',OPEN:'The work needs nothing from the student\u2019s actual surroundings.'}},
  P7:{tier:2,name:'AI stance',why:'Assuming AI use and assessing how well the student interrogates it beats an unenforceable prohibition, and it prepares students for the work they\u2019re actually headed into.',
      read:{WELL:'AI use is assigned and the student\u2019s critique of it is assessed.',PART:'AI use is permitted with disclosure.',OPEN:'The prompt is silent on AI, or bans it with no way to check.'}},
  P8:{tier:2,name:'Socially situated',why:'Classmate collaboration is off the table here, but the underlying value survives: interview a neighbor, teach a concept to a sibling, gather real opinions. Social, unschedulable, unfabricatable.',
      read:{WELL:'Interaction with a real person outside the LMS is required.',PART:'Such interaction is offered as an option.',OPEN:'The whole task can be completed alone at a keyboard.'}}
};
const BAND = { WELL:{label:'Well established',cls:'well',pos:'92%'}, PART:{label:'Partially present',cls:'part',pos:'54%'}, OPEN:{label:'Open opportunity',cls:'open',pos:'16%'} };

/* =====================================================================
   MOVE LIBRARY — 42 moves. Blocked moves are absent by construction.
   ===================================================================== */
const MOVES = [
{id:'M1',p:'P1',t:'Escalate the verb',s:'Rewrite the core task from recall or explain to analyze, evaluate, or create.',
 w:'The single cheapest structural change available. A summary task and an evaluation task can cover identical content while producing entirely different evidence \u2014 one asks what the field says, the other asks what the student concludes and why.',
 q:'What is the new core verb, and what does the student now produce that they could not have produced by summarizing?'},
{id:'M2',p:'P1',t:'Introduce a constrained design problem',s:'Give a problem with real tradeoffs and no clean answer.',
 w:'Constraints that genuinely conflict force prioritization, and prioritization is a judgment call. A model will produce a defensible answer, but it can\u2019t defend it against your specific constraints without inventing them.',
 q:'What are the competing constraints, and why can\u2019t all of them be satisfied at once?'},
{id:'M3',p:'P1',t:'Critique a flawed exemplar',s:'Have students diagnose what\u2019s wrong with a deliberately weak example \u2014 including an AI-generated one.',
 w:'Critique demands a standard, and articulating a standard is harder than meeting one. Using an AI-generated exemplar does double duty: students practice evaluation and learn what a model\u2019s output actually looks like.',
 q:'What flawed exemplar will you supply, and what specifically should a strong critique catch in it?'},
{id:'M4',p:'P1',t:'Position plus strongest counterargument',s:'Require a defensible position and the best case against it.',
 w:'Steelmanning the opposition is where thin understanding shows. A student who can only argue one side has learned a conclusion, not a field.',
 q:'What is the question they take a position on, and what counterargument would you consider the strongest one available?'},
{id:'M5',p:'P1',t:'Apply to an unfamiliar case',s:'Require transfer to a case the course never covered.',
 w:'Transfer is the difference between knowing a framework and being able to use it. Choosing a case that isn\u2019t in any textbook also means there\u2019s no existing analysis to retrieve.',
 q:'What unfamiliar case will they apply this to, and what makes it a real test rather than a restatement?'},

{id:'M6',p:'P2',t:'Stage into low-stakes checkpoints',s:'Break the work into a proposal, an outline, a draft, and a revision.',
 w:'The foundational process move. Each checkpoint is evidence in its own right, and low stakes at each step encourages genuine iteration rather than a performance of iteration.',
 q:'What does the student turn in first, and what would you look for in it? List each checkpoint and what it has to show.'},
{id:'M7',p:'P2',t:'Require a revision log',s:'Document what changed between drafts and why.',
 w:'A revision log is a record of thinking under pressure. It is specific to a particular draft and a particular piece of feedback, which makes it structurally hard to fabricate.',
 q:'What should the revision log capture \u2014 what kinds of changes, and what counts as an adequate reason?'},
{id:'M8',p:'P2',t:'Require a decision log',s:'Capture choices considered and rejected, with reasoning.',
 w:'The rejected options are the interesting part. A model can produce a defensible path; it can\u2019t produce the path this student didn\u2019t take and explain why they turned away from it.',
 q:'What decisions will this task actually force, and what should the log say about each one?'},
{id:'M9',p:'P2',t:'Grade an annotated draft',s:'Assess a draft the student has marked up, not just the final artifact.',
 w:'Annotation makes intent visible. A student explaining why a paragraph is there is doing something different from a student producing the paragraph.',
 q:'What should the student annotate, and what makes an annotation substantive rather than decorative?'},
{id:'M10',p:'P2',t:'Documented response to feedback',s:'Require evidence of what the student did with the feedback they received.',
 w:'Feedback that disappears into the void teaches nothing. Requiring a documented response makes the feedback loop itself assessable.',
 q:'What feedback will they receive, and what does an adequate documented response to it look like?'},
{id:'M11',p:'P2',t:'Submit working notes and dead ends',s:'Require the messy material \u2014 source annotations, abandoned approaches.',
 w:'Dead ends are the strongest single signal of genuine work, because there is no reason for a model to generate them and no easy way to fake having had one.',
 q:'What working material should they keep, and how will you tell them to capture it as they go?'},

{id:'M12',p:'P3',t:'Recorded oral defense',s:'A 3\u20135 minute unscripted video, with the defense prompt revealed at recording time.',
 w:'The highest-yield move in this whole library for an asynchronous school. Revealing the prompt at recording time is what makes it work \u2014 it removes the window in which a script could be prepared.',
 q:'What will the defense prompt ask, and what would tell you the student genuinely owns the reasoning?'},
{id:'M13',p:'P3',t:'Screencast walkthrough',s:'The student narrates their own work on screen, explaining their choices.',
 w:'Walking through your own artifact while explaining it requires a relationship with that artifact. Gaps show up immediately and are hard to talk around.',
 q:'What should they walk through, and what choices should they be required to explain?'},
{id:'M14',p:'P3',t:'Audio explainer or podcast',s:'Submit the work as a recorded audio piece for a stated audience.',
 w:'Audio strips away visual polish and leaves reasoning and voice. A stated audience adds a real rhetorical constraint.',
 q:'Who is the audience, how long should it run, and what has to be covered?'},
{id:'M15',p:'P3',t:'Annotated visual artifact',s:'A flowchart, diagram, or concept map with narrated explanation.',
 w:'Diagramming forces explicit relationships between ideas. Narrating the diagram forces the student to defend those relationships out loud.',
 q:'What has to appear in the visual, and what should the narration explain about it?'},
{id:'M16',p:'P3',t:'Physical model or artifact',s:'Build something, photograph it, and explain it.',
 w:'A physical object exists in one place, and its photographs are unique to the student. The explanation ties the object back to course concepts.',
 q:'What will they build, from what materials, and what does the explanation need to connect it to?'},
{id:'M17',p:'P3',t:'Single-take recording requirement',s:'One component must be recorded in a single unedited take.',
 w:'Editing is where a script gets smoothed in. A single take is a specific, checkable technical requirement that changes what the recording can be.',
 q:'Which component is single-take, how long, and what should be visible or audible throughout?'},
{id:'M18',p:'P3',t:'Handwritten work plus recorded explanation',s:'Photograph handwritten or whiteboard work alongside a recorded walkthrough.',
 w:'Especially strong in mathematics and the sciences: the written trace shows the path, and the recording shows whether the student can account for it.',
 q:'What work should be handwritten, and what should the recorded explanation cover?'},

{id:'M19',p:'P4',t:'Graded reflection on the reasoning process',s:'Assess an account of how the thinking actually went.',
 w:'Ungraded reflection gets skipped or performed. Grading it signals that the thinking is the object, not an afterthought attached to the product.',
 q:'What specific questions will the reflection answer, and what distinguishes a strong one from a going-through-the-motions one?'},
{id:'M20',p:'P4',t:'AI-use disclosure with critique',s:'Require students to say how they used AI and where its output fell short.',
 w:'The critique half is what matters. Naming a specific place a model got something wrong requires having checked it against something the student actually knows.',
 q:'What should they disclose, and what does a substantive critique of AI output look like in this subject?'},
{id:'M21',p:'P4',t:'Before-and-after understanding statement',s:'What did you think at the start of this unit, and what do you think now?',
 w:'This requires a real memory of a prior state. It also produces a record of conceptual change that you can use in later assessment.',
 q:'What understanding should have shifted, and what should the statement address?'},
{id:'M22',p:'P4',t:'Confidence and uncertainty mapping',s:'What do you still not know, and how do you know that?',
 w:'Calibrated uncertainty is a hallmark of real understanding and something models are notably poor at. Students who don\u2019t understand the material can\u2019t locate its edges.',
 q:'What should they map their confidence across, and how should they justify the uncertain parts?'},
{id:'M23',p:'P4',t:'A moment you changed your mind',s:'Require an account of one specific point where the student\u2019s view shifted.',
 w:'Highly specific and unfakeable in practice. It requires a particular moment, a particular prior belief, and a particular cause.',
 q:'What kinds of mind-changing would you expect in this unit, and what should the account include?'},

{id:'M24',p:'P5',t:'Consume earlier student-produced data',s:'This task takes as input something the student produced in an earlier assignment.',
 w:'If the input is the student\u2019s own earlier output, the task cannot be completed by someone \u2014 or something \u2014 without access to it. This is the strongest structural link available.',
 q:'Which earlier assignment produces the input, and how exactly does this task depend on it?'},
{id:'M25',p:'P5',t:'Produce an artifact a later task requires',s:'The output here becomes structurally necessary input downstream.',
 w:'Forward linkage raises the cost of a hollow submission: thin work here creates a visible problem for the student two assignments from now.',
 q:'What does this task produce, and which later assignment can\u2019t proceed without it?'},
{id:'M26',p:'P5',t:'Running portfolio thread',s:'Maintain a single accumulating artifact across the unit.',
 w:'A portfolio thread makes coherence assessable across time. Inconsistency between entries is visible in a way it never is within a single submission.',
 q:'What does the thread accumulate, and when do entries get added?'},
{id:'M27',p:'P5',t:'Cross-task consistency check',s:'Later work must reconcile with claims made in earlier work.',
 w:'Requiring reconciliation \u2014 including admitting a change of position \u2014 turns the chain itself into evidence.',
 q:'Which earlier claims must be reconciled here, and what does adequate reconciliation look like?'},
{id:'M28',p:'P5',t:'Revisit and revise earlier work',s:'Return to an earlier submission and revise it with new knowledge.',
 w:'This makes learning visible as change over time, and it requires the student to have an actual relationship with what they submitted weeks ago.',
 q:'Which earlier submission gets revisited, and what should the revision demonstrate?'},

{id:'M29',p:'P6',t:'Site-specific data collection',s:'Students gather data from their own physical environment.',
 w:'One prompt, and every student returns a different dataset. Because the students are scattered, the variation is automatic rather than something you have to engineer.',
 q:'What will they measure or record, where, and using what protocol?'},
{id:'M30',p:'P6',t:'Local issue analysis',s:'Apply course frameworks to something happening in the student\u2019s own community.',
 w:'Local issues have specifics \u2014 names, histories, geography \u2014 that a model has no access to and will fabricate if pushed.',
 q:'What kind of local issue counts here, and what course frameworks must the analysis apply?'},
{id:'M31',p:'P6',t:'Personal experience as primary source',s:'Analyze a lived experience using course concepts.',
 w:'The analysis is the assessed part, not the experience. This keeps the rigor while making the source material unavailable to anyone else.',
 q:'What kind of experience is in scope, and what does the analysis have to do with it?'},
{id:'M32',p:'P6',t:'Photograph and measure something nearby',s:'Document a physical thing within reach of the student.',
 w:'A dated photograph of a specific object with the student\u2019s own measurements is evidence that cannot be generated. It also anchors abstract concepts to something real.',
 q:'What should they photograph and measure, and what technical requirements apply to the images?'},
{id:'M33',p:'P6',t:'Apply concepts to something from this week',s:'Connect course material to something the student encountered recently.',
 w:'The recency constraint is doing the work: it requires something that happened after any model\u2019s knowledge of the world, in the student\u2019s own life.',
 q:'What counts as an eligible encounter, and what must the connection demonstrate?'},

{id:'M34',p:'P7',t:'Assign AI use and assess the critique',s:'Require AI use, then grade how well the student interrogates the output.',
 w:'This converts an unenforceable rule into an assessable skill. The student who can\u2019t evaluate the output is the one this exposes.',
 q:'What will you have them ask the model, and what should their critique of the response cover?'},
{id:'M35',p:'P7',t:'Correct or improve AI output',s:'Students must fix AI-generated work and justify each change.',
 w:'Correction requires a standard the student holds independently. Justifying each change is where that standard becomes visible.',
 q:'What AI output will they work from, and what standard should their corrections meet?'},
{id:'M36',p:'P7',t:'Compare your attempt against an AI attempt',s:'Analyze the gap between the student\u2019s own work and the model\u2019s.',
 w:'This is metacognition and AI literacy in one move, and it produces something genuinely useful to the student: a clear sense of what they add.',
 q:'What should they compare, and what should the gap analysis specifically address?'},
{id:'M37',p:'P7',t:'Document the prompting process',s:'Require a record of prompts used and what the student changed.',
 w:'Prompt iteration is itself a reasoning trace. What a student tried and rejected reveals their model of the problem.',
 q:'What should the prompting record include, and how should they present it?'},

{id:'M38',p:'P8',t:'Interview someone in the student\u2019s own life',s:'A family member, neighbor, or working professional \u2014 never a classmate.',
 w:'A real interview produces a transcript no model has seen and no model could invent convincingly. It requires no scheduling with the school and no classmate dependency.',
 q:'Who should they interview, what should they ask, and what has to be submitted as evidence?'},
{id:'M39',p:'P8',t:'Observe a real setting',s:'Report on an actual place against course frameworks.',
 w:'Direct observation produces particulars \u2014 what was actually there, at that hour, in that weather \u2014 that generic description never contains.',
 q:'What kind of setting, for how long, and what should the observation record?'},
{id:'M40',p:'P8',t:'Solicit feedback from a non-classmate',s:'Get a response from someone outside the course and document what was done with it.',
 w:'Explaining work to someone who isn\u2019t in the course tests whether the student can actually communicate it. The documented response makes the loop assessable.',
 q:'Who counts as an appropriate reader, what should you ask them for, and what should the student do with it?'},
{id:'M41',p:'P8',t:'Teach the concept to someone',s:'Explain it to a person in their life and report what confused them.',
 w:'The report on what confused the listener is the assessed part, and it is unfakeable in practice: it requires an actual person\u2019s actual confusion.',
 q:'What concept do they teach, to whom, and what should the report on the confusion cover?'},
{id:'M42',p:'P8',t:'Gather real opinions or small-sample data',s:'Collect responses from people the student knows.',
 w:'A small real sample beats a large fabricated one for assessment purposes. The messiness is the point \u2014 real responses don\u2019t fit the framework cleanly.',
 q:'What will they ask, of how many people, and how should the responses be recorded and analyzed?'}
];
const MEDIA_MOVES = ['M12','M13','M14','M15','M16','M17','M18'];
const STAGED_MOVES = ['M6','M9','M10','M26','M28'];

/* =====================================================================
   DIAGNOSTIC
   ===================================================================== */
const GROUPS = [
 {title:'What the student has to do', note:'Three questions about the thinking the task demands.', qs:[
  {id:'q1',text:'Which verb best describes what the student must actually do?',type:'one',opts:[['recall','Recall or define'],['explain','Explain or summarize'],['apply','Apply a known procedure'],['analyze','Analyze or compare'],['evaluate','Evaluate or critique'],['create','Create something original']]},
  {id:'q2',text:'How many defensible answers exist?',type:'one',opts:[['one','One correct answer'],['narrow','A narrow range of acceptable answers'],['many','Many defensible answers depending on the reasoning'],['open','An open design space with no predetermined answer']]},
  {id:'q3',text:'Could a well-informed adult who never took your course produce an acceptable submission?',type:'one',opts:[['yes','Yes, easily'],['probably','Probably'],['partly','Only partly'],['no','No']]}]},
 {title:'How the work becomes visible', note:'What you see between assigning it and receiving it.', qs:[
  {id:'q4',text:'How many graded or reviewed touchpoints exist between assigning this and the final submission?',type:'one',opts:[['one','One \u2014 they submit once at the end'],['two','Two or three'],['four','Four or more']]},
  {id:'q5',text:'Does the student submit evidence of how the work evolved \u2014 drafts, notes, a revision or decision log?',type:'one',opts:[['none','None'],['optional','Optional or ungraded'],['required','Required and graded']]},
  {id:'q6',text:'If a final submission seemed disconnected from the student\u2019s earlier work, would you have an earlier artifact to compare it against?',type:'one',opts:[['no','No'],['informal','Informally'],['yes','Yes, a graded artifact exists']]}]},
 {title:'What actually gets submitted', note:'The physical form of the evidence.', qs:[
  {id:'q7',text:'What does the student submit? Select all that apply.',type:'many',opts:[['doc','Typed document'],['slides','Slides'],['video','Video'],['audio','Audio'],['image','Image or artwork'],['code','Code'],['physical','Photographed physical artifact'],['data','Spreadsheet or dataset'],['other','Something else']]},
  {id:'q8',text:'Does the student\u2019s own voice or face appear anywhere in the submission?',type:'one',opts:[['no','No'],['optional','Optional'],['required','Required']]}]},
 {title:'Accounting for their own thinking', note:'Two questions about reflection.', qs:[
  {id:'q9',text:'Is the student required to reflect on their own reasoning process?',type:'one',opts:[['no','No'],['ungraded','Yes, but ungraded'],['graded','Yes, and it is graded']]},
  {id:'q10',text:'Does the assignment require the student to describe how they used AI, or where AI output fell short?',type:'one',opts:[['no','No'],['encouraged','Encouraged but not required'],['required','Required']]}]},
 {title:'What this task is attached to', note:'Its place in the sequence.', qs:[
  {id:'q11',text:'Does this assignment consume data, artifacts, or feedback produced by an earlier assignment?',type:'one',opts:[['no','No'],['loosely','Loosely'],['directly','Yes, directly and necessarily']]},
  {id:'q12',text:'Does a later assignment depend on what the student produces here?',type:'one',opts:[['no','No'],['loosely','Loosely'],['directly','Yes, directly and necessarily']]}]},
 {title:'Where the material comes from', note:'One question.', qs:[
  {id:'q13',text:'Does the work require data, observations, images, or experiences drawn from the student\u2019s own environment or life?',type:'one',opts:[['no','No'],['somewhat','Somewhat, or optional'],['core','Core to the task']]}]},
 {title:'The stated position on AI', note:'One question.', qs:[
  {id:'q14',text:'What is the assignment\u2019s current stated stance on AI use?',type:'one',opts:[['prohibited','Prohibited'],['silent','Silent or unstated'],['permitted','Permitted with disclosure'],['assessed','Required and assessed']]}]},
 {title:'Other people', note:'One question.', qs:[
  {id:'q15',text:'Does the work require interaction with a real person outside the LMS \u2014 an interview, an observation, feedback from someone in the student\u2019s life?',type:'one',opts:[['no','No'],['optional','Optional'],['required','Required']]}]},
 {title:'Your read on it', note:'Not scored. This one is here so you can check your instinct against the structure.', qs:[
  {id:'q16',text:'If a student pasted this assignment prompt into a current AI model with no other context, what would come back?',type:'one',opts:[['pass','A submission that would pass'],['light','Something needing light edits'],['insufficient','Something clearly insufficient'],['unsure','I\u2019m honestly not sure']]}]}
];

/* =====================================================================
   SCORING
   ===================================================================== */
function score() {
  const a = state.answers, b = {};
  const down = x => x==='WELL' ? 'PART' : 'OPEN';
  if (['recall','explain'].includes(a.q1)) b.P1='OPEN';
  else if (a.q1==='apply' && ['one','narrow'].includes(a.q2)) b.P1='OPEN';
  else if (['analyze','evaluate','create'].includes(a.q1) && ['partly','no'].includes(a.q3)) b.P1='WELL';
  else b.P1='PART';

  if (a.q4==='one' && a.q5==='none') b.P2='OPEN';
  else if (a.q4!=='one' && a.q5==='required') b.P2='WELL';
  else b.P2='PART';
  if (a.q6==='no') b.P2 = down(b.P2);

  const sub = a.q7||[], media = sub.includes('video')||sub.includes('audio');
  const textOnly = sub.length>0 && sub.every(s => s==='doc'||s==='slides');
  if (textOnly && a.q8==='no') b.P3='OPEN';
  else if (media && a.q8==='required') b.P3='WELL';
  else b.P3='PART';

  if (a.q9==='no' && a.q10==='no') b.P4='OPEN';
  else if (a.q9==='graded' && a.q10==='required') b.P4='WELL';
  else b.P4='PART';

  if (a.q11==='no' && a.q12==='no') b.P5='OPEN';
  else if (a.q11==='directly'||a.q12==='directly') b.P5='WELL';
  else b.P5='PART';

  b.P6 = {no:'OPEN',somewhat:'PART',core:'WELL'}[a.q13];
  b.P7 = {prohibited:'OPEN',silent:'OPEN',permitted:'PART',assessed:'WELL'}[a.q14];
  b.P8 = {no:'OPEN',optional:'PART',required:'WELL'}[a.q15];
  return b;
}
const CLAUSE = {
  P1:'satisfiable with general knowledge rather than course-specific judgment',
  P2:'assessed at a single endpoint, with no record of how the work developed',
  P3:'submitted as text alone, with no student voice or face anywhere in it',
  P4:'submitted without any account of the student\u2019s own reasoning',
  P5:'standing on its own, unconnected to the work before or after it'
};
function headline(b) {
  const open = ['P1','P2','P3','P4','P5'].filter(k=>b[k]==='OPEN');
  if (!open.length) {
    const part = ['P1','P2','P3','P4','P5'].filter(k=>b[k]==='PART');
    return part.length
      ? `This assignment is already carrying structural weight in several places. ${part.length} dimension${part.length>1?'s are':' is'} present but not yet load-bearing \u2014 that\u2019s where the leverage is.`
      : 'Structurally, this one is in good shape. The moves below are about sharpening what\u2019s already working rather than adding.';
  }
  const list = open.map(k=>CLAUSE[k]);
  const joined = list.length===1 ? list[0] : list.slice(0,-1).join('; ') + '; and ' + list[list.length-1];
  const n = ['One','Two','Three','Four','Five'][open.length-1];
  return `Right now this assignment is ${joined} \u2014 which means a strong AI submission would be hard to tell apart from a strong student one. ${n} change${open.length>1?'s':''} would shift that.`;
}
function calibration(b) {
  const oc = ['P1','P2','P3','P4','P5'].filter(k=>b[k]==='OPEN').length, g = state.answers.q16;
  if (g==='insufficient' && oc>=2) return 'You read this as AI-resistant, and the structure reads more open than that. Worth a look \u2014 the gap between those two is usually where the surprise lives.';
  if (g==='pass' && oc===0) return 'You\u2019re harder on this one than its structure is. It may be doing more work than you\u2019re giving it credit for.';
  if (g==='unsure') return 'You weren\u2019t sure what a model would return. Running the revised prompt through one yourself, cold, will answer that in about two minutes.';
  return 'Your instinct and the structural read are pointing the same direction.';
}

const MODALITIES = ['Typed document','Slides','Video','Audio','Image or artwork','Code','Dataset','Physical artifact','Mixed'];
function analyzeUnit() {
  const items = state.unit.items;
  const consumedBy = {};
  items.forEach(it=>{ if(it.consumes) (consumedBy[it.consumes]=consumedBy[it.consumes]||[]).push(it.id); });
  const rows = items.map(it=>({ ...it, feeds: consumedBy[it.id]||[], alone: !it.consumes && !(consumedBy[it.id]||[]).length }));
  const counts = {}; items.forEach(it=>{ if(it.modality) counts[it.modality]=(counts[it.modality]||0)+1; });
  let dominant=null, dn=0; Object.entries(counts).forEach(([k,v])=>{ if(v>dn){dn=v;dominant=k;} });
  const concentrated = items.length>=3 && dn/items.length >= 0.6;
  let pick=null, best=-1;
  rows.forEach((r,i)=>{ const s = (r.alone?2:0) + (['Typed document','Slides'].includes(r.modality)?1:0);
    if (s>best) { best=s; pick=r; } });
  return { rows, dominant, dn, concentrated, pick, best };
}
function chainSvg(rows) {
  const n = rows.length, W = Math.max(n*120, 240), idx = {};
  rows.forEach((r,i)=>idx[r.id]=i);
  const x = i => 60 + i*120;
  const arcs = rows.filter(r=>r.consumes && idx[r.consumes]!==undefined).map(r=>{
    const a = x(idx[r.consumes]), b = x(idx[r.id]), mid=(a+b)/2, lift = 34 + Math.min(Math.abs(idx[r.id]-idx[r.consumes])*8,20);
    return `<path d="M ${a} 62 Q ${mid} ${62-lift} ${b} 62" fill="none" stroke="#37736C" stroke-width="1.5" marker-end="url(#ar)"/>`;
  }).join('');
  const nodes = rows.map((r,i)=>`

const CONSTRAINTS = `Standing constraints for this school. Never suggest, under any framing:
- synchronous sessions, live oral defenses, real-time Q&A, or anything requiring students to be present at a set time
- proctored or timed examinations
- required student-to-student collaboration, group projects, or peer review requiring pairing or scheduling
- in-person attendance or physical gathering
Treat as first-class instead: asynchronous recorded video and audio; interaction with people in the student's own life (family, neighbors, working professionals); and the geographically scattered student body as an asset for local grounding.`;

function contextBlock() {
  const c = state.context, L = [];
  L.push(`Subject: ${c.subject}`);
  L.push(`Grade: ${c.grade}`);
  if (c.course) L.push(`Course: ${c.course}`);
  if (c.position) L.push(`Position in course: ${c.position}`);
  if (c.time) L.push(`Student time investment: ${c.time}`);
  if (c.goal) L.push(`What students should be able to do: ${c.goal}`);
  if (Object.keys(state.answers).length >= 16) {
    const b = score();
    L.push(`Structural read of the current version: ${Object.keys(DIMS).map(k=>`${DIMS[k].name} ${BAND[b[k]].label.toLowerCase()}`).join('; ')}.`);
  }
  return L.join('\n');
}
function movePrompt(id) {

  const L = [];
  L.push(`I'm redesigning an assessment for a fully asynchronous virtual high school where every student works from home with unrestricted AI access. Help me draft one specific piece of it.`);
  L.push('');
  L.push(CONSTRAINTS);
  L.push('');
  L.push('CONTEXT');
  L.push(contextBlock());

  L.push('');
  L.push('THE MOVE I NEED DRAFTED');
  L.push(`${m.t} \u2014 ${m.s}`);

}
function stressPrompt() {
  const L = [];
  L.push(`Attempt the assignment below exactly as an unmotivated student would: you have no course materials, no class notes, no data you collected yourself, and no access to anything local or personal. You have only this prompt and what you already know. Don't ask me clarifying questions \u2014 just produce what you would actually turn in.`);
  L.push('');
  L.push(`Then, after your attempt, add a section headed WHAT I COULD NOT DO. In it, list every component of the assignment you were unable to genuinely complete, and say plainly why \u2014 whether it needed firsthand data, a recording of a real person, evidence from earlier work, or something else you don't have.`);
  L.push('');
  L.push('Be honest rather than helpful. If you could produce something passable, say so.');
  L.push('');
  L.push('--- ASSIGNMENT BEGINS ---');

function briefingPrompt() {
  const L = [];

  L.push('');

  const st = state.stress;
  if (st.verdict) {
    const vt = { pass:'Yes \u2014 it produced something that would pass.', light:'Nearly \u2014 it produced something needing light edits.', insufficient:'No \u2014 what it produced was clearly insufficient.' };
    L.push(`Would an AI attempt pass? ${vt[st.verdict]}`);
    if (state.answers.q16 && state.answers.q16 !== 'unsure')
      L.push(`The designer predicted, before redesigning: ${Q16TEXT[state.answers.q16]}.`);
    if (st.satisfied.trim()) { L.push(''); L.push('Components the model could satisfy:'); L.push(st.satisfied.trim()); }
    if (st.resisted.trim()) { L.push(''); L.push('Components it structurally could not \u2014 these are the ones doing the work:'); L.push(st.resisted.trim()); }
    if (st.output.trim()) { L.push(''); L.push('What the model produced:'); L.push('---'); L.push(st.output.trim()); L.push('---'); }
  } else {
    L.push('Not yet run. Before distributing, paste Part 2 into a capable model with no other');
    L.push('context, ask it to attempt the assignment cold, and note which components it can');
    L.push('satisfy and which it cannot.');
  }
  L.push('');
  if (state.notes.trim()) { L.push('## Notes and open questions'); L.push(state.notes.trim()); L.push(''); }
  if (state.unit.items.length) {
    const A = analyzeUnit();
    L.push('## Unit-level brief');
    L.push(`Unit: ${state.unit.subject||'\u2014'}${state.unit.duration?` \u00b7 ${state.unit.duration}`:''}`);
    if (state.unit.goals) L.push(`Purpose: ${state.unit.goals}`);
    L.push('');
    L.push('Assessments in order:');
    A.rows.forEach((r,i)=>{
      const from = r.consumes ? (state.unit.items.find(o=>o.id===r.consumes)||{}).name : null;
      L.push(`  ${i+1}. ${r.name||'Untitled'} \u2014 ${r.modality||'modality not set'}${r.alone?'  [STANDS ALONE]':''}`);
      if (r.desc) L.push(`     ${r.desc}`);
      if (from) L.push(`     takes input from: ${from}`);
      if (r.feeds.length) L.push(`     feeds: ${r.feeds.map(f=>(state.unit.items.find(o=>o.id===f)||{}).name||'Untitled').join(', ')}`);
    });
    L.push('');
    const alone = A.rows.filter(r=>r.alone);
    L.push(alone.length
      ? `Standing alone: ${alone.map(r=>r.name||'Untitled').join(', ')}. Each defends itself entirely on its own.`
      : 'Every assessment is linked to something before or after it.');
    if (A.concentrated) L.push(`Modality concentration: ${A.dn} of ${A.rows.length} arrive as ${A.dominant.toLowerCase()}.`);
    if (A.pick) L.push(`Highest leverage to redesign first: ${A.pick.name||'Untitled'}.`);
    L.push('');
  }
  L.push('='.repeat(60)); L.push('PART 2 \u2014 STUDENT-FACING DRAFT'); L.push('='.repeat(60)); L.push('');
  const body = assemble().trim();
  L.push(body || '_Not yet authored in this session._');
  L.push('');
  if (state.rubric) {
    L.push('## Rubric');
    L.push(`Weights total ${weightTotal()}%, with ${surfaceTotal()}% on surface features.`);
    L.push('');
    state.rubric.criteria.forEach(c=>{
      L.push(`### ${c.name} \u2014 ${c.weight}%`);
      c.lv.forEach((t,j)=>L.push(`  ${LEVELS[j]}: ${t}`));
      L.push('');
    });
    L.push('Notes for whoever scores this:');
    L.push('- On recorded components, score what the student says, not how smoothly they say it.');
    L.push('  Hesitation and self-correction are signs of live thinking.');
    L.push('- Performed reflection is fluent, general, and flattering. Genuine reflection is specific,');
    L.push('  occasionally unflattering, and usually mentions something that didn\u2019t work.');
    L.push('- When a final product seems disconnected from the checkpoints before it, the checkpoints');
    L.push('  are the evidence. Ask the question; don\u2019t assume the answer.');
    L.push('');
  }
  if (!done) { L.push('---'); L.push('IN PROGRESS \u2014 this draft is not yet complete and should not be distributed.'); }

  const name = [c.course||c.subject||'Assignment', c.assignment||'Redesign', new Date().toISOString().slice(0,10)]
    .join('_').replace(/\s+/g,'').replace(/[^A-Za-z0-9_\-]/g,'');
  const blob = new Blob([L.join('\n')], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name + '.md'; a.click();
  URL.revokeObjectURL(a.href);
  if (done) state.touched = false;
}

render();
</script>
</body>
</html>
